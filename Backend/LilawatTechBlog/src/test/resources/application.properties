# ========== datasource (H2 in-memory) ==========
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
# driver-class-name optional but explicit is okay
spring.datasource.driver-class-name=org.h2.Driver

# ========== JPA ==========
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop   # ok for tests/dev; use 'update' or 'validate' in prod
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========== Hikari tuning & diagnostics ==========
# keep pool small for tests/dev, increase for real load
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# enable leak detection to spot long-held connections (milliseconds)
# set to ~20s while debugging, remove or increase later
spring.datasource.hikari.leak-detection-threshold=20000

# Optional: show Hikari debug logs (turn on only while debugging)
logging.level.com.zaxxer.hikari=DEBUG

# ========== H2 Console (optional but handy) ==========
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========== Additional helpful logging while debugging handler mapping / resources ==========
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.resource.ResourceHttpRequestHandler=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG
