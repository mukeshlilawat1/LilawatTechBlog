version: "3.8"

services:
  db:
    image: postgres:latest
    container_name: techblog_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1215
      POSTGRES_DB: techblog
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  adminer:
    image: adminer:latest
    container_name: techblog_adminer
    restart: always
    ports:
      - "8888:8080"
    depends_on:
      - db

volumes:
  pgdata:
