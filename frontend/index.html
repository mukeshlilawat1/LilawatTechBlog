      gtag("config", "G-3EK4B7H7BP", {

      });

      // Track page views on SPA route change
      window.addEventListener("popstate", function () {
        gtag("event", "page_view", {
          page_title: document.title,
          page_location: window.location.href,
          page_path: window.location.pathname,
        });
      });

      // Track scroll depth
      let scrollDepths = [25, 50, 75, 100];
      let scrollTracked = [];
      window.addEventListener("scroll", function () {
        let scrollPercent = Math.round(
          (window.scrollY / (document.body.scrollHeight - window.innerHeight)) *
            100,
        );
        scrollDepths.forEach(function (depth) {
          if (scrollPercent >= depth && !scrollTracked.includes(depth)) {
            scrollTracked.push(depth);
            gtag("event", "scroll_depth", {
              event_category: "Engagement",
              event_label: depth + "%",
              value: depth,
            });
          }
        });
      });

      // Track outbound links
      document.addEventListener("click", function (e) {
        let target = e.target.closest("a");
        if (
          target &&
          target.href &&
          !target.href.includes("lilawattechblog.in")
        ) {
          gtag("event", "click", {
            event_category: "Outbound Link",
            event_label: target.href,
            transport_type: "beacon",
          });
        }
      });
